; PgBouncer config for bare-metal / VM installs (not required when using docker-compose).
; Point your app at listen_port; keep Postgres on 5432 for migrations (DIRECT_DATABASE_URL).

[databases]
remittance_db = host=127.0.0.1 port=5432 dbname=remittance_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; transaction mode — required for Prisma (prepared statements disabled via ?pgbouncer=true)
pool_mode = transaction

; Many app processes × few server connections each
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 100

server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits

admin_users = postgres
stats_users = postgres

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
